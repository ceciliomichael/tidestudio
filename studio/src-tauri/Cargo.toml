[package]
name = "tidestudio"
version = "0.1.4"
description = "A focused llama-server desktop manager"
authors = ["TideStudio"]
edition = "2024"

[lib]
name = "tidestudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["fs", "io-util"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
